name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck zsh
      - name: Run tests
        run: tests/run.sh
